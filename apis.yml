name: Better Mortgage
description: >-
  Better (Better Home & Finance Company, operating as Better Mortgage) is a
  New York-based fintech founded in 2014 by Vishal Garg that digitizes home
  finance end to end. Its online platform originates purchase mortgages,
  refinances, home equity lines of credit (HELOC), and VA loans, and connects
  borrowers with title, closing, homeowners insurance (via Better Cover), and
  real-estate agent matching. Better was the first fintech to fund over $100
  billion in home loans entirely online and markets an "AI-powered" One Day
  Mortgage experience. Better does not publish a general-purpose public
  developer API, but it operates a live OpenID Connect / OAuth 2.0 identity
  provider (backed by AWS Cognito) for partner single sign-on, discoverable at
  its /.well-known endpoints.
